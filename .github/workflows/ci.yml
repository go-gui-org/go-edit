name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only. Nothing here publishes, comments or tags, so the job token
# needs no more than the checkout.
permissions:
  contents: read

# go-edit contains no cgo: no file in the module declares `import "C"`
# or a #cgo directive. The editor core is pure Go, and the npad example
# draws through go-gui, which is pure Go on Linux and Windows. The
# SDL2, FreeType, HarfBuzz, Pango and fontconfig packages this workflow
# used to install on both platforms were left over from go-glyph's cgo
# era and are gone.
#
# Neither job pins CGO_ENABLED. Linux keeps the toolchain default so
# -race has the C toolchain it still needs, and macOS keeps it so a
# darwin build links go-gui's Metal backend rather than silently
# succeeding without it.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-edit

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Test
        working-directory: go-edit
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./edit/...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-edit

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Vet
        working-directory: go-edit
        run: go vet ./edit/...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go-edit
          args: ./edit/...
